name: Signed test APK

on:
  push:
    branches: [codex/ru-stress-apk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OZVUCHKA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::OZVUCHKA_KEYSTORE_BASE64 is required for an installable update."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/ozvuchka.jks"
          echo "OZVUCHKA_KEYSTORE=$RUNNER_TEMP/ozvuchka.jks" >> "$GITHUB_ENV"

      - name: Test and build signed APK
        env:
          OZVUCHKA_KEYSTORE_PASSWORD: ${{ secrets.OZVUCHKA_KEYSTORE_PASSWORD }}
          OZVUCHKA_KEY_ALIAS: ${{ secrets.OZVUCHKA_KEY_ALIAS }}
          OZVUCHKA_KEY_PASSWORD: ${{ secrets.OZVUCHKA_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify APK signature
        run: |
          metadata=app/build/outputs/apk/release/output-metadata.json
          apk="app/build/outputs/apk/release/$(jq -r '.elements[0].outputFile' "$metadata")"
          test -f "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -n "$signer"
          "$signer" verify --verbose "$apk"
          cp "$apk" "$RUNNER_TEMP/ozvuchka-test.apk"
          cp "$metadata" "$RUNNER_TEMP/output-metadata.json"

      - uses: actions/upload-artifact@v4
        with:
          name: ozvuchka-signed-test-apk
          path: |
            ${{ runner.temp }}/ozvuchka-test.apk
            ${{ runner.temp }}/output-metadata.json
          if-no-files-found: error
          retention-days: 7
