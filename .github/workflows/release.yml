name: Release

# Every merge into main is published as a GitHub release: an APK signed with the app's own key, so it
# installs over the previous version and keeps the books and settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OZVUCHKA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No OZVUCHKA_KEYSTORE_BASE64 secret: a release must be signed with the app's own key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/ozvuchka.jks"
          echo "OZVUCHKA_KEYSTORE=$RUNNER_TEMP/ozvuchka.jks" >> "$GITHUB_ENV"

      - name: Release APK
        env:
          OZVUCHKA_KEYSTORE_PASSWORD: ${{ secrets.OZVUCHKA_KEYSTORE_PASSWORD }}
          OZVUCHKA_KEY_ALIAS: ${{ secrets.OZVUCHKA_KEY_ALIAS }}
          OZVUCHKA_KEY_PASSWORD: ${{ secrets.OZVUCHKA_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon :app:assembleRelease

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata=app/build/outputs/apk/release/output-metadata.json
          code=$(jq -r '.elements[0].versionCode' "$metadata")
          name=$(jq -r '.elements[0].versionName' "$metadata")
          apk="$RUNNER_TEMP/ozvuchka-$code.apk"
          cp "app/build/outputs/apk/release/$(jq -r '.elements[0].outputFile' "$metadata")" "$apk"
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Скачайте APK ниже и откройте его на телефоне: версия ставится поверх предыдущей, книги, позиции и настройки сохраняются.

          Если телефон пишет, что приложение не установлено, удалите старую версию один раз: сборки до первого релиза были подписаны другим ключом.
          EOF
          gh release create "v${name%% *}.$code" "$apk" \
            --target "$GITHUB_SHA" \
            --title "PupsChitalka $name" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --latest
