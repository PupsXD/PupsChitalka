            <p>Лампа над столом горела ровно, и тень от кувшина лежала на карте, как ещё одна страна, ненайденная и неспешная.</p>
            <p>— Здесь, — сказал штурман и постучал пальцем, — море кончается, а дальше только бумага и наши обещания.</p>
