<div class="poem">
    <br />
    Над тихой рекой опускается вечер,<br />
    И лодка качается у берегов,<br />
    И кто-то зажёг вдалеке свои свечи,<br />
    И ветер принёс мне обрывки стихов.<br />
    Я слушаю долго, дышать не решаясь,<br />
    И звёзды выходят смотреть на меня.
</div>
